service: soch-vibe-coding-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_ANON_KEY: ${env:SUPABASE_ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY}
    ADMIN_USER: ${env:ADMIN_USER, 'admin'}
    ADMIN_PASS: ${env:ADMIN_PASS, 'admin123'}
    JWT_SECRET: ${env:JWT_SECRET, 'soch_vibe_coding_secret_key_2026'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          method: any
          path: /{proxy+}
          cors: true
      - http:
          method: any
          path: /
          cors: true

plugins:
  - serverless-offline
